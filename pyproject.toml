[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day08-langgraph-agent-lab"
version = "0.1.0"
description = "Starter skeleton for LangGraph agentic orchestration lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "langgraph>=0.3.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]
google = ["langchain-google-genai>=2.1.0"]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

[project.scripts]
agent-lab = "langgraph_agent_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "F401"]
"tests/test_graph_smoke.py" = ["ANN", "E501", "F401", "E402"]
"src/langgraph_agent_lab/graph.py" = ["ANN201", "ANN401"]
"src/langgraph_agent_lab/llm.py" = ["ANN201"]
"src/langgraph_agent_lab/persistence.py" = ["ANN401"]
"src/langgraph_agent_lab/state.py" = ["ANN401", "E501", "I001"]
"src/langgraph_agent_lab/metrics.py" = ["E501"]
"src/langgraph_agent_lab/scenarios.py" = ["F401"]
"src/langgraph_agent_lab/nodes.py" = ["E501"]
"src/langgraph_agent_lab/report.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
